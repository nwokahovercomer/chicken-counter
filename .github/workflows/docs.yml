name: Docs

# Pull requests: run every check. Push to main: run every check, then publish the site.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify docs and proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs generator
        run: pip install -r requirements-docs.txt
      - name: Links, nav and freshness
        run: python tools/check_docs.py
      - name: Mermaid diagrams parse
        run: |
          npm ci --prefix tools
          node tools/validate-mermaid.mjs docs README.md
      - name: Proxy tests
        run: node --test proxy/test/worker.test.mjs
      - name: Build the site (catches config errors)
        run: zensical build --clean

  deploy:
    name: Publish to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
